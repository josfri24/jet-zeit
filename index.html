<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb701">
<meta name="apple-mobile-web-app-title" content="Jet-Zeit">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jet-Zeit V1.12</title>
<style>
:root{--acc:#1f4e79;--accT:#fff;--bg:#eef1f5;--card:#fff;--ink:#1d2530;--mut:#6b7684;--line:#dde2e9;--ok:#23955a;--go:#d6492f;--dis:#c5cbd3;--we:#f5f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
input,select,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;color:inherit}
h1,h2,h3{margin:0 0 12px}
h2{font-size:24px} h3{font-size:18px;margin-top:6px}
.mut{color:var(--mut)} .small{font-size:14px} .sp{flex:1}
/* Header */
header{background:var(--acc);color:var(--accT);display:flex;align-items:center;gap:18px;padding:12px 22px;min-height:84px;flex:0 0 auto}
header .logo{height:64px;max-width:300px;object-fit:contain}
header .co{flex:1;min-width:0}
header .co b{display:block;font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .co span{opacity:.85;font-size:15px}
header .clk{text-align:right;white-space:nowrap}
header .clk b{font-size:36px;font-variant-numeric:tabular-nums;display:block;line-height:1.05}
header .clk span{font-size:15px;opacity:.85}
main{flex:1;overflow:auto;padding:18px 22px;-webkit-overflow-scrolling:touch}
@supports(padding:max(0px)){
 header{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
 main{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));padding-bottom:max(18px,env(safe-area-inset-bottom))}
 #modal{padding-bottom:max(16px,env(safe-area-inset-bottom))}
 #toast{bottom:max(26px,calc(env(safe-area-inset-bottom) + 12px))}
}
html.ios input,html.ios select,html.ios textarea{font-size:16px!important}
html.ios body{-webkit-text-size-adjust:100%}
html.ios .bb,html.ios .btn,html.ios button{-webkit-tap-highlight-color:transparent}
/* Home */
.home{height:100%;display:flex;flex-direction:column;gap:12px}
.emps{flex:1;min-height:0;display:grid;gap:22px;grid-template-columns:repeat(var(--c,4),minmax(0,var(--tw,240px)));grid-template-rows:repeat(var(--r,2),minmax(0,var(--th,210px)));grid-auto-rows:minmax(0,var(--th,210px));justify-content:center;align-content:center;overflow:auto;padding:6px}
.emp{container-type:size;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;padding:8px;transition:transform .08s,box-shadow .08s;border:4px solid rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.10),0 10px 24px rgba(20,30,45,.22);background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.10));min-height:0}
.emp.light{background:#fff!important;background-image:none;border:4px solid var(--ec);color:var(--ink)!important}
.emp.light .av{border-color:var(--ec)}
.emp.light .st{background:var(--ec);color:#fff}
.emp:active{transform:scale(.96);box-shadow:0 0 0 1px rgba(0,0,0,.1),0 4px 10px rgba(20,30,45,.2)}
.emp .av{width:min(42cqh,52cqw);height:min(42cqh,52cqw);font-size:min(18cqh,22cqw)}
.av{width:96px;height:96px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.28) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;border:3px solid rgba(255,255,255,.75)}
.av.sm{width:56px;height:56px;font-size:24px;border-width:2px}
.av.xs{width:40px;height:40px;font-size:18px;border-width:2px}
.emp .nm{font-size:clamp(15px,min(14cqh,16cqw),32px);font-weight:800;line-height:1.1;text-align:center}
.emp .st{font-size:clamp(11px,6.5cqh,14px);background:rgba(0,0,0,.2);padding:3px 10px;border-radius:20px;white-space:nowrap}
main.bgimg{background-size:cover;background-position:center}
main.bgimg .foot span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
main.bgimg .empty{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.foot{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.foot button{background:#fff;border-radius:12px;padding:10px 16px;font-size:15px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;color:var(--mut);line-height:1.6}
/* Buttons & forms */
.btn{padding:12px 18px;border-radius:12px;background:#e3e8ef;color:var(--ink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:6px;min-height:46px}
.btn.p{background:var(--acc);color:var(--accT)}
.btn.d{background:#fbe1dc;color:#a8321e}
.btn:disabled{opacity:.45}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fld{display:block;margin:0 0 14px;font-size:14px;color:var(--mut);font-weight:600}
.fld input,.fld select,.row2 input{display:block;width:100%;margin-top:5px;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:17px;font-weight:400;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-size:16px;min-height:40px}
.chk input{width:26px;height:26px;accent-color:var(--acc)}
.acts{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.warn{background:#fff3cd;color:#7a5a00;padding:10px 14px;border-radius:10px;font-size:15px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.sw input[type=color]{width:54px;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.imgrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;background:#e3e8ef;border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 18px;border-radius:9px;font-weight:600;background:none;min-height:40px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* Employee screen */
.ehead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ehead .en{flex:1;min-width:180px}
.ehead .en b{display:block;font-size:26px}
.ehead .en span{color:var(--mut)}
.bigb{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.bb{height:170px;border-radius:24px;color:#fff;font-size:46px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 16px rgba(0,0,0,.16);transition:transform .08s}
.bb:active:not(:disabled){transform:scale(.97)}
.bb small{font-size:16px;font-weight:500;opacity:.9}
.bb.in{background:var(--ok)} .bb.out{background:var(--go)}
.bb:disabled{background:var(--dis);box-shadow:none;color:#f3f4f6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpis div{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpis span{display:block;color:var(--mut);font-size:14px}
.kpis b{font-size:26px;font-variant-numeric:tabular-nums}
.lbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lbar .nav{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.lbar .nav b{min-width:210px;text-align:center;font-size:17px}
/* Table */
.lp.slim{width:fit-content;max-width:100%;margin:0 auto}
.lp.slim .lbar .nav{flex:0 1 auto}
.tw{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table.tz{width:100%;border-collapse:collapse;font-size:15px}
.tz th{background:var(--acc);color:var(--accT);text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap}
.tz td{padding:3px 8px;height:38px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.tz .n{padding-right:14px}
.tz .nt{padding-left:16px}
.tz .n{text-align:right;white-space:nowrap}
.tz td:first-child{white-space:nowrap}
.adm{font-size:15px;max-width:1180px;margin:0 auto}
.adm .atop{margin-bottom:8px}.adm .atop h1{font-size:19px;font-weight:650}
.adm .tabs{gap:4px;margin-bottom:12px}
.adm .tabs button{padding:6px 13px;font-size:14px;border-radius:8px;font-weight:550}
.adm .card{padding:12px 16px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.adm h3{font-size:15px;font-weight:650;margin:2px 0 8px;color:#2b3542}
.adm .card h3+h3,.adm .card *+h3{margin-top:14px}
.adm .fld{font-size:12.5px;font-weight:500;margin:0 0 9px;max-width:560px}
.adm .row2 .fld{max-width:none}
.adm .fld input,.adm .fld select,.adm .row2 input{height:34px;font-size:14.5px;border-width:1px;border-radius:7px;margin-top:3px;padding:0 9px}
.adm .row2{gap:10px;max-width:760px}
.adm .chk{font-size:14px;min-height:26px;margin:2px 0 7px;gap:9px}
.adm .chk input{width:17px;height:17px}
.adm .btn{min-height:34px;padding:6px 12px;font-size:14px;border-radius:8px;font-weight:550}
.adm .acts{margin-top:10px;gap:8px}
.adm .warn{font-size:13px;padding:7px 11px;border-radius:8px}
.adm .mut{font-size:13.5px}.adm .small{font-size:12.5px}
.adm p{margin:6px 0}
.adm .sw{gap:6px}.adm .sw button{width:28px;height:28px;border-width:2px}
.adm .sw input[type=color]{width:40px;height:28px;border-radius:7px}
.adm .bigacts{gap:8px}.adm .bigacts .btn{padding:9px 10px;font-size:14.5px}
.adm .mrow{padding:6px 0;gap:10px}
.adm .snap{padding:6px 0}.adm .snap .btn{padding:5px 10px;font-size:13px;min-height:30px}
.tz tr.b2 td{background:#eaf0f7}
.tz tr.cf td,.tz tr.cf.b2 td,.tz tr.cf.we td{background:#fde0d9!important}
.tz tr.cf td:first-child{box-shadow:inset 4px 0 0 var(--go)}
.srcm{font-size:11px;color:var(--mut);margin-left:5px;cursor:help}
.mtab{width:100%;border-collapse:collapse;font-size:14px}
.mtab th{text-align:left;font-weight:600;color:var(--mut);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.mtab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtab .n{text-align:right;white-space:nowrap}
.mtab .ok{color:var(--ok);font-weight:600}.mtab .bad{color:var(--go);font-weight:700;cursor:pointer;text-decoration:underline}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnav b{font-size:16px;min-width:140px;text-align:center}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.box.wide{max-width:900px}
.badge.cl{background:#e3e8ef;color:#2b3542}.badge.op{background:#e3f4ea;color:var(--ok)}
.tz tr.we td{background:#f3eefb;color:#5d5670}
.tz tr.we.b2 td{background:#e9e1f6}
.tz tr.we td:first-child{color:#6a4c9c;font-weight:600}
.tz tr.df td{border-top:1px solid #b9c4d2}
.tz tr.nl td{border-bottom:0}
.sdot{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#fff;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.sdot.ok{color:var(--ok)} .sdot.warn{color:#b26a00} .sdot.err{color:#fff;background:var(--go)}
.bkw{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:#fff3cd;color:#7a5a00;cursor:pointer}
.snap{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.snap:last-child{border-bottom:0}
.snap .btn{padding:8px 12px;font-size:14px}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.bigacts .btn{padding:16px 14px;font-size:17px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tz tr.td td,.tz tr.td.we td,.tz tr.td.b2 td{background:#fff6d6}
.tz tr.ct td{border-top:0}
.tz tr.ws td{background:#e2e9f2;font-weight:700;border-bottom:3px solid var(--acc)}
.tz tfoot td{background:var(--acc);color:var(--accT);font-weight:800;font-size:17px;border:0;height:44px}
.tz tr.ws td{height:34px}
.tz .nt{color:var(--mut);font-size:14px}
.tz th.nt{color:var(--accT);font-size:inherit}
input[type=file]{display:none!important}
.tz .open{color:var(--go);font-weight:700}
.tz .nw{white-space:nowrap;text-align:right}
.ed{background:#eef2f7;color:var(--edc,var(--acc));font-size:17px;width:38px;height:32px;border-radius:8px;margin-left:4px}
/* Admin */
.atop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.atop h1{margin:0;font-size:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:11px 20px;border-radius:12px;background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabs button.on{background:var(--acc);color:var(--accT)}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:1}
.mrow .mn b{display:block}
.tag{display:inline-block;font-size:12px;background:#e3e8ef;border-radius:6px;padding:2px 7px;margin-right:4px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:30px;background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips button.on{outline:3px solid var(--acc)}
.logoprev{background:var(--acc);border-radius:10px;padding:10px;display:inline-block;min-width:160px;text-align:center;color:var(--mut)}
.logoprev img{max-height:80px;max-width:260px}
/* Modal, PIN */
#modal{position:fixed;inset:0;background:rgba(15,22,32,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.box.pin{max-width:420px;text-align:center}
.pin h2{margin:10px 0 2px}
.dots{display:flex;justify-content:center;gap:14px;height:28px;margin:16px 0 20px}
.dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--acc);display:block}
.dots i.f{background:var(--acc)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:14px;justify-content:center;margin-bottom:16px}
.pad button{height:92px;border-radius:50%;font-size:34px;font-weight:600;background:#f0f3f7}
.pad button:active{background:#d9e1ec}
.pad button.fn{font-size:24px}
.pad button.ok{background:var(--acc);color:var(--accT)}
.pin .av{border-color:var(--line)}
.obtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.obtns .btn{justify-content:center;min-height:58px;font-size:17px}
/* Overlay & toast */
#ov{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:8px}
#ov.on{display:flex} #ov.in{background:var(--ok)} #ov.out{background:var(--go)}
#ov .ovi{font-size:110px;line-height:1}
#ov .ovt{font-size:56px;font-weight:800}
#ov .ovs{font-size:30px}
#ov .ovx{font-size:22px;opacity:.95}
#ov .ovh{font-size:16px;opacity:.8;margin-top:20px}
#ov .btn{background:rgba(255,255,255,.22);color:#fff;margin-top:14px;font-size:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#1d2530;color:#fff;padding:13px 22px;border-radius:12px;z-index:90;transition:transform .25s;font-weight:600;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:#a8321e}
#print{display:none}
@media (max-width:760px){
 .bb{height:130px;font-size:34px}
 .kpis b{font-size:20px}
 .tz{font-size:14px} .tz td,.tz th{padding:6px 6px}
 .tz .nt{display:none}
 header .clk b{font-size:26px} header .co b{font-size:20px}
 .pad{grid-template-columns:repeat(3,80px)} .pad button{height:80px}
}
@media (max-width:560px){
 header{gap:10px;padding:8px 12px;min-height:60px}
 main{padding:12px max(12px,env(safe-area-inset-left)) max(14px,env(safe-area-inset-bottom))}
 header .logo{height:38px;max-width:120px}
 header .co b{font-size:16px} header .co span{display:none}
 header .clk b{font-size:20px} header .clk span{font-size:11px}
 .foot{flex-wrap:wrap;gap:6px;font-size:12px}
 .foot button{padding:8px 11px;font-size:13.5px}
 .sdot,.bkw{font-size:11.5px;padding:4px 8px}
 .tabs button{padding:6px 10px}
 .lbar{flex-wrap:wrap;gap:6px}
 .tz .yr{display:none}
 table.tz{font-size:12.5px} .tz col{width:auto!important}
 .tz td,.tz th{padding:4px 5px;height:32px}
 .tz thead th:nth-child(4),.tz tbody tr:not(.ws) td:nth-child(4){display:none}
 .tz tfoot td{font-size:14px}
 .tz .ed{padding:0;width:30px;height:30px;min-height:0;font-size:14px}
 .tw{overflow-x:auto}
 .lbar .nav{flex-wrap:wrap;gap:4px} .lbar .nav b{font-size:14px}
 .lbar .nav .btn{min-height:36px;padding:6px 10px}
}
@media print{
 @page{size:A4 portrait;margin:12mm}
 html,body{height:auto;overflow:visible;background:#fff;display:block;font-size:10pt}
 body>*:not(#print){display:none!important}
 #print{display:block}
 .pg{page-break-after:always;break-after:page}
 .pg:last-child{page-break-after:auto;break-after:auto}
 .ph{display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:10px}
 .ph img{max-height:48px;max-width:160px}
 .ph .pc{flex:1}
 .ph .pr{text-align:right}
 table.tz{font-size:9pt}
 .tz th{background:#ddd!important;color:#000!important;padding:4px 6px}
 .tz td{padding:2px 6px;height:auto;border-bottom:1px solid #ccc}
 .tz th.nt{color:#000!important;font-size:9pt}
 .tz tr.ws td,.tz tfoot td{height:auto}
 table.tz.slim{width:auto;min-width:62%}
 table.tz.slim td,table.tz.slim th{padding-left:10px;padding-right:12px}
 .tz tr.b2 td{background:#eeeeee!important}
 .tz tr.we td{background:#e2e2e2!important;color:#222}
 .tz tr.we td:first-child{font-weight:700;color:#000}
 .tz tr.df td{border-top:1px solid #999}
 .tz tr.td.b1 td{background:none!important}
 .tz tr.td.b2 td{background:#eeeeee!important}
 .tz tr.ws td{background:#e6e6e6!important;border-bottom:2px solid #000}
 .tz tfoot td{background:#ccc!important;color:#000!important;font-size:11pt}

const monKey=(y,m)=>y+'-'+pad(m+1);

function defMonth(){const d=new Date();if(d.getDate()<=10)return shiftMonth(monKey(d.getFullYear(),d.getMonth()),-1);return monKey(d.getFullYear(),d.getMonth());}
function shiftMonth(k,n){const [y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return monKey(d.getFullYear(),d.getMonth());}

const devName=id=>id===DEV.id?(DEV.name||'dieses Gerät'):((DB.devices||{})[id]||'anderes Gerät');
const chk=o=>crc32(new TextEncoder().encode(JSON.stringify(o))).toString(16);
function dayConflicts(sh){const bad=new Set();for(let a=0;a<sh.length;a++)for(let b=a+1;b<sh.length;b++){const x=sh[a],y=sh[b];if(x.o==null||y.o==null)continue;if(x.i<y.o&&y.i<x.o){bad.add(a);bad.add(b);}}return bad;}
/* eigene Buchungen eines Monats (dieses Gerät bzw. ohne Herkunft), nur abgeschlossene */
function monthShifts(e,mk,own){const o=DB.data[e.id]||{},r={};let open=0;for(const [k,a] of Object.entries(o)){if(!k.startsWith(mk))continue;
 const b=a.filter(s=>(!own||!s.src||s.src===DEV.id));open+=b.filter(s=>s.o==null).length;const c=b.filter(s=>s.o!=null);if(c.length)r[k]=c;}return{days:r,open};}
function reportFile(mk){const list=isPersonal()?DB.emps.slice(0,1):DB.emps;let open=0;
 const emps=list.map(e=>{const ms=monthShifts(e,mk,true);open+=ms.open;let tot=0,nd=0;for(const a of Object.values(ms.days)){tot+=dayCalc(a).net;nd++;}
  return{id:e.id,nr:e.nr||'',first:e.first,last:e.last||'',days:ms.days,total:tot,nDays:nd};}).filter(x=>isPersonal()||x.nDays);
 const body={month:mk,device:{id:DEV.id,name:DEV.name||(isPersonal()?'Handy '+((DB.emps[0]||{}).first||''):'Terminal')},personal:isPersonal(),emps};
 const n=new Date(),j={app:'Jet-Zeit',type:'report',version:VERSION,created:n.toISOString(),...body,check:chk(body)};
 const p=DB.emps[0]||{},who=isPersonal()?safeName((p.last?p.last+'_':'')+(p.first||'')):safeName(DEV.name||'Terminal');
 return{j,open,blob:new Blob([JSON.stringify(j,null,1)],{type:'application/json'}),name:'Jet-Zeit-Meldung_'+mk+'_'+who+'.json'};}

function matchEmp(x){return DB.emps.find(e=>e.id===x.id)||(x.nr?DB.emps.find(e=>String(e.nr||'').trim()===String(x.nr).trim()):null)||DB.emps.find(e=>fullName(e).toLowerCase()===(x.first+' '+(x.last||'')).trim().toLowerCase())||null;}
function planReport(j,fname){const out={j,fname,items:[],err:''};
 if(!j||j.type!=='report'||!j.month||!Array.isArray(j.emps)){out.err='keine Jet-Zeit-Monatsmeldung';return out;}
 out.altered=chk({month:j.month,device:j.device,personal:j.personal,emps:j.emps})!==j.check;
 const dev=(j.device&&j.device.id)||'?';
 if(dev===DEV.id){out.err='Meldung stammt von diesem Gerät selbst';return out;}
 if(DB.closed&&DB.closed[j.month]){out.err=monLabel(j.month)+' ist abgeschlossen';return out;}
 const prev=((DB.reportsIn||{})[j.month]||{})[dev];if(prev&&prev.created>j.created){out.err='älter als die bereits eingelesene Meldung vom '+fmtTs(prev.created);return out;}
 for(const x of j.emps){const e=matchEmp(x);const it={x,e,add:0,dup:0,rem:0,total:x.total||0};
  if(e){const o=DB.data[e.id]||{};const kept={};for(const [k,a] of Object.entries(o))if(k.startsWith(j.month)){kept[k]=a.filter(s=>!(s.src===dev&&s.eb!=='Admin'));it.rem+=a.length-kept[k].length;}
   for(const [k,a] of Object.entries(x.days||{}))for(const s of a){const ex=kept[k]||[];if(ex.some(y=>(y.k&&y.k===s.k)||(y.i===s.i&&y.o===s.o)))it.dup++;else it.add++;}}
  out.items.push(it);}
 return out;}
function applyReport(p){const j=p.j,dev=j.device.id;DB.devices=DB.devices||{};DB.devices[dev]=j.device.name||'anderes Gerät';DB.devKind=DB.devKind||{};DB.devKind[dev]=j.personal?'p':'t';
 for(const it of p.items){if(!it.e)continue;const e=it.e,o=DB.data[e.id]||{};
  const keys=new Set([...Object.keys(o).filter(k=>k.startsWith(j.month)),...Object.keys(it.x.days||{})]);
  for(const k of keys){const arr=(o[k]||[]).filter(s=>!(s.src===dev&&s.eb!=='Admin'));
   for(const s of (it.x.days||{})[k]||[]){if(arr.some(y=>(y.k&&y.k===s.k)||(y.i===s.i&&y.o===s.o)))continue;arr.push({...s,src:dev,k:s.k||uid()});}
   setShifts(e,k,arr);}}
 DB.reportsIn=DB.reportsIn||{};DB.reportsIn[j.month]=DB.reportsIn[j.month]||{};
 DB.reportsIn[j.month][dev]={name:j.device.name||'',created:j.created,at:new Date().toISOString(),emps:p.items.filter(i=>i.e).map(i=>i.e.id),personal:!!j.personal};}

function openShift(e){const t=new Date();for(const key of [ymd(t),ymd(addDays(t,-1))]){const a=getShifts(e,key);for(let k=a.length-1;k>=0;k--)if(a[k].o==null)return{date:key,idx:k};}return null;}
function dayCalc(sh){let gross=0,gaps=0,open=false,prevO=null;
 for(const s of sh){if(s.o==null){open=true;continue;}gross+=s.o-s.i;if(prevO!=null&&s.i>prevO)gaps+=s.i-prevO;prevO=s.o;}
 const st=S();let pause=0;if(st.pauseOn&&gross>st.pauseAfter*60)pause=Math.max(0,Math.min(st.pauseMin-gaps,gross));
 return{gross,pause,net:gross-pause,open};}
function buildPeriod(e,from,to,label){const weeks=[];let cur=null;const total={net:0,pause:0,days:0};
 for(let d=new Date(from);d<=to;d=addDays(d,1)){
  if(!cur||d.getDay()===1){cur={kw:isoWeek(d),days:[],net:0};weeks.push(cur);}
  const key=ymd(d),sh=getShifts(e,key),c=dayCalc(sh);
  cur.days.push({date:new Date(d),key,shifts:sh,...c});cur.net+=c.net;total.net+=c.net;total.pause+=c.pause;if(c.gross>0)total.days++;}
 weeks.forEach(w=>{w.from=w.days[0].date;w.to=w.days[w.days.length-1].date;});
 return{from,to,label,weeks,total};}
const monthPeriod=(e,y,m)=>buildPeriod(e,new Date(y,m,1),new Date(y,m+1,0),MON[m]+' '+y);
const weekPeriod=(e,d)=>{const mo=mondayOf(d);return buildPeriod(e,mo,addDays(mo,6),'KW '+isoWeek(mo)+'/'+addDays(mo,3).getFullYear());};
function noteText(d,s,k){const p=[];if(s.n)p.push(s.n);if(s.e)p.push('✎ korrigiert');if(k===d.shifts.length-1&&d.pause>0)p.push('Pause −'+d.pause+' Min');return p.join(' · ');}
function status(e){const os=openShift(e),tk=ymd(new Date()),t=getShifts(e,tk);
 if(os){const s=getShifts(e,os.date)[os.idx];return{canIn:false,canOut:true,since:s.i,text:'Anwesend seit '+hm(s.i)+(os.date!==tk?' (gestern)':'')};}
 if(!e.multi&&t.some(s=>s.o!=null))return{canIn:false,canOut:false,text:'Heute bereits gebucht: '+t.map(s=>hm(s.i)+'–'+hm(s.o,true)).join(', ')};
 return{canIn:true,canOut:false,text:t.length?'Abwesend · heute bisher '+fmtH(dayCalc(t).net)+' '+unitTxt():'Heute noch nicht eingestempelt'};}

const IMPORTS=[]; /* Web-Version: keine Übernahmedaten */
function migrate(){const st=DB.settings;DB.imports=DB.imports||{};
 if(!DB.imports.branding){if(st.company==='Meine Firma'&&!st.logo)Object.assign(st,{company:DEF_S.company,subtitle:DEF_S.subtitle,boss:DEF_S.boss,logo:JET_LOGO,accent:DEF_S.accent,accentText:DEF_S.accentText});DB.imports.branding=new Date().toISOString();}
 for(const o of Object.values(DB.data))for(const [k,a] of Object.entries(o)){const b=a.filter(s=>s.o==null||s.o>s.i);if(b.length!==a.length){if(b.length)o[k]=b;else delete o[k];}}
 if(!DB.imports.fmt12){st.hourFmt='stdmin';DB.imports.fmt12=new Date().toISOString();}
 for(const im of IMPORTS){if(DB.imports[im.id]||DB.imports.done)continue;
  let e=DB.emps.find(x=>fullName(x).toLowerCase()===im.emp.toLowerCase());
  if(!e){if(DB.emps.length>=MAX_EMP)continue;const [f,...l]=im.emp.split(' ');e={id:uid(),first:f,last:l.join(' '),nr:'',color:'#024794',photo:'',icon:'',pin:'1234',multi:true,active:true};DB.emps.push(e);}
  for(const [k,list] of Object.entries(im.days)){const a=getShifts(e,k).slice();
   for(const [i,o] of list){const clash=a.some(s=>s.o!=null?(i<s.o&&o>s.i):(s.i>=i&&s.i<o));if(!clash)a.push({i,o,n:'',x:'Excel'});}
   setShifts(e,k,a);}
  DB.imports[im.id]=new Date().toISOString();}
 save();}

/* ---------- Booking ---------- */
function book(type){const e=curEmp,st=status(e),now=new Date(),key=ymd(now);
 const raw=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
 const step=Math.max(1,+S().round||1);let m=Math.round((now.getHours()*60+now.getMinutes()+now.getSeconds()/60)/step)*step;
 let dayKey=key;
 if(type==='in'){if(!st.canIn)return;if(m>=1440)m=1440-step;const a=getShifts(e,key).slice();a.push({i:m,o:null,n:'',ri:raw,k:uid(),src:DEV.id});setShifts(e,key,a);}
 else{const os=openShift(e);if(!os)return;dayKey=os.date;const a=getShifts(e,os.date).slice();const s={...a[os.idx]};let o=os.date===key?m:m+1440;if(o<s.i)o=s.i;
  if(o<=s.i){a.splice(os.idx,1);setShifts(e,os.date,a);save();overlay('void',o,dayKey);return;}
  s.o=o;s.ro=raw;a[os.idx]=s;setShifts(e,os.date,a);m=o;}
 save();overlay(type,m,dayKey);}

  const sec=+S().afterBookSec;clearTimeout(ovT);ovT=setTimeout(()=>{ov.className='';if(sec>0)goHome();else render();},(sec>0?sec:3)*1000);ov.onclick=()=>{clearTimeout(ovT);ov.className='';render();};return;}

function loadImg(file,max,type,square){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let sx=0,sy=0,sw=im.width,sh=im.height;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;}const sc=Math.min(1,max/Math.max(sw,sh));const w=Math.round(sw*sc),h=Math.round(sh*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);res(c.toDataURL(type,0.85));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

/* sections: [{emp, periods:[P], kind}] */
function sections(emps,ref){return emps.map(e=>{let periods;
 if(ref.kind==='week')periods=[weekPeriod(e,ref.date)];
 else if(ref.kind==='month')periods=[monthPeriod(e,ref.y,ref.m)];
 else periods=MON.map((_,m)=>monthPeriod(e,ref.y,m));return{emp:e,periods};});}
function refLabel(ref){if(ref.kind==='week'){const mo=mondayOf(ref.date);return'KW '+isoWeek(mo)+' ('+dmy(mo)+' – '+dmy(addDays(mo,6))+')';}if(ref.kind==='month')return MON[ref.m]+' '+ref.y;return'Jahr '+ref.y;}
function refFile(ref){if(ref.kind==='week'){const mo=mondayOf(ref.date);return addDays(mo,3).getFullYear()+'_KW'+pad(isoWeek(mo));}if(ref.kind==='month')return ref.y+'-'+pad(ref.m+1);return String(ref.y);}
function fileBase(secs,ref){return'Jet-Zeit_'+(secs.length===1?safeName(fullName(secs[0].emp)):'Alle')+'_'+refFile(ref);}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('Datei erstellt: '+name);}
const hasData=P=>P.total.days>0||P.weeks.some(w=>w.days.some(d=>d.shifts.length));

/* Print */
function printHead(e,title,range){const st=S();return`<div class="ph">${st.logo?`<img src="${st.logo}" alt="">`:''}<div class="pc"><b style="font-size:13pt">${esc(st.company)}</b><br>${esc(st.subtitle)}${st.boss?'<br>Geschäftsführer: '+esc(st.boss):''}</div><div class="pr"><b style="font-size:12pt">${esc(title)}</b><br>${esc(fullName(e))}${e.nr?' · Pers.-Nr. '+esc(e.nr):''}<br>${esc(range)}</div></div>`;}
const printFoot=()=>`<div class="sig"><div>Datum, Unterschrift Mitarbeiter/in</div><div>Datum, Unterschrift Arbeitgeber${S().boss?' ('+esc(S().boss)+')':''}</div></div><div class="pf">Erstellt am ${dmy(new Date())} ${hm(new Date().getHours()*60+new Date().getMinutes())} mit Jet-Zeit V${VERSION} · Zeiten gerundet auf ${S().round} Min${unitTxt()?' · Angaben in '+unitTxt():''}</div>`;
function printSections(secs,ref){let h='';
 for(const s of secs){const e=s.emp;
  if(ref.kind==='year'){let rows='',tot=0,days=0;s.periods.forEach(P=>{tot+=P.total.net;days+=P.total.days;rows+=`<tr><td>${esc(P.label)}</td><td class="n">${fmtH(P.total.net)}</td></tr>`;});
   h+=`<div class="pg">${printHead(e,'Jahresübersicht '+ref.y,'01.01.'+ref.y+' – 31.12.'+ref.y)}<table class="tz"><thead><tr><th>Monat</th><th class="n">Arbeitszeit</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td>Gesamt ${ref.y}</td><td class="n">${fmtH(tot)}</td></tr></tfoot></table>${printFoot()}</div>`;
   s.periods.filter(hasData).forEach(P=>{h+=`<div class="pg">${printHead(e,'Arbeitszeitnachweis',P.label)}${tableHTML(P,false,notesOn(e))}${printFoot()}</div>`;});}
  else{const P=s.periods[0];h+=`<div class="pg">${printHead(e,'Arbeitszeitnachweis',refLabel(ref))}${tableHTML(P,false,notesOn(e))}${printFoot()}</div>`;}}
 $('#print').innerHTML=h;setTimeout(()=>window.print(),80);}
window.addEventListener('afterprint',()=>{$('#print').innerHTML='';});

/* CSV (flach, eine Zeile pro Buchung) */
function exportCsv(secs,ref){const q=v=>{v=String(v??'');return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 const L=[['Mitarbeiter','Pers.-Nr.','Datum','Wochentag','KW','Kommen','Gehen','Dauer (Std)','Pause (Min)','Tagessumme (Std dezimal)','Tagessumme','Bemerkung','Korrigiert','Original Kommen','Original Gehen'].join(';')];
 for(const s of secs){let tot=0;for(const P of s.periods)for(const w of P.weeks)for(const d of w.days){tot+=d.net;d.shifts.forEach((sh,k)=>{const last=k===d.shifts.length-1;
  L.push([fullName(s.emp),s.emp.nr||'',dmy(d.date),WD[d.date.getDay()],isoWeek(d.date),hm(sh.i),sh.o==null?'offen':hmx(sh.o),sh.o==null?'':dec(sh.o-sh.i),last?d.pause:'',last?dec(d.net):'',last?fmtH(d.net):'',sh.n||'',sh.e?'ja':'',sh.ri||'',sh.ro||''].map(q).join(';'));});}
  L.push([fullName(s.emp),s.emp.nr||'','Summe '+refLabel(ref),'','','','','','','',dec(tot),fmtH(tot),'','',''].map(q).join(';'));}
 download(new Blob(['﻿'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),fileBase(secs,ref)+'.csv');}

/* Text */
function exportTxt(secs,ref){const st=S(),W=92,line=c=>c.repeat(W);const out=[];
 const row=(a,b,c,d,e,f)=>a.padEnd(16)+b.padEnd(8)+c.padEnd(10)+d.padStart(14)+e.padStart(15)+'  '+f;
 for(const s of secs){
  for(const P of s.periods){if(ref.kind==='year'&&!hasData(P))continue;
   out.push(line('='),st.company,(st.subtitle||'')+(st.boss?' · Geschäftsführer: '+st.boss:''),'Arbeitszeitnachweis – '+fullName(s.emp)+(s.emp.nr?' (Pers.-Nr. '+s.emp.nr+')':''),'Zeitraum: '+(ref.kind==='year'?P.label:refLabel(ref)),line('-'),row('Datum','Kommen','Gehen','Dauer','Tag','Bemerkung'),line('-'));
   for(const w of P.weeks){for(const d of w.days){if(!d.shifts.length){out.push(row(fmtDate(d.date),'','','','',''));continue;}
     d.shifts.forEach((sh,k)=>{const last=k===d.shifts.length-1;out.push(row(k?'':fmtDate(d.date),hm(sh.i),sh.o==null?'offen':hmx(sh.o),sh.o==null?'':fmtH(sh.o-sh.i),last?fmtH(d.net):'',notesOn(s.emp)?noteText(d,sh,k).replace('✎ ',''):''));});}
    out.push(('  Woche KW '+w.kw+' ('+dm(w.from)+'–'+dm(w.to)+')').padEnd(48)+fmtH(w.net).padStart(15),line('-'));}
   out.push(('GESAMT '+P.label).padEnd(48)+fmtH(P.total.net).padStart(15)+'  '+unitTxt(),'');}
  if(ref.kind==='year'){let t=0;s.periods.forEach(P=>t+=P.total.net);out.push(line('='),('JAHRESSUMME '+ref.y+' – '+fullName(s.emp)).padEnd(48)+fmtH(t).padStart(15)+'  '+unitTxt(),'');}}
 out.push('Erstellt am '+dmy(new Date())+' mit Jet-Zeit V'+VERSION);
 download(new Blob(['﻿'+out.join('\r\n')],{type:'text/plain;charset=utf-8'}),fileBase(secs,ref)+'.txt');}

/* XLSX (eigener Generator, ohne Bibliothek) – Layout wie Vorlage: Datum | Beginn | Ende | Beginn | Ende | Stunden | Bemerkungen */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function zipStore(files,mime){const enc=new TextEncoder(),parts=[],cen=[];let off=0;const d=new Date();
 const dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
 for(const f of files){const nm=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
  parts.push(h.buffer,nm,data);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cen.push(c.buffer,nm);off+=30+nm.length+data.length;}
 let csz=0;cen.forEach(p=>csz+=p.byteLength);
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cen,e.buffer],{type:mime});}
const xe=s=>String(s??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const colL=i=>i<26?String.fromCharCode(65+i):String.fromCharCode(64+Math.floor(i/26))+String.fromCharCode(65+i%26);
/* Styles: 0 normal, 1 fett, 2 Zahl 0.00, 3 Kopf/Summe fett+Fläche, 4 Summe Zahl 0.00, 5 Zeit [h]:mm, 6 Summe [h]:mm, 7 Titel groß, 8 Wochenende grau */
function xlsxBlob(sheets){const files=[];const used=new Set();
 sheets.forEach((sh,i)=>{let nm=sh.name.replace(/[\[\]:*?\/\\]/g,'').slice(0,31)||('Blatt'+(i+1));let b=nm,k=2;while(used.has(nm.toLowerCase())){nm=b.slice(0,28)+' '+k++;}used.add(nm.toLowerCase());sh.name=nm;
  let x='<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"'+(i===0?' tabSelected="1"':'')+'/></sheetViews><cols>'+sh.cols.map((w,j)=>`<col min="${j+1}" max="${j+1}" width="${w}" customWidth="1"/>`).join('')+'</cols><sheetData>';
  sh.rows.forEach((r,ri)=>{x+=`<row r="${ri+1}">`;r.forEach((c,ci)=>{if(c==null)return;const ref=colL(ci)+(ri+1);const s=c.s?` s="${c.s}"`:'';
   if(typeof c.v==='number')x+=`<c r="${ref}"${s}><v>${c.v}</v></c>`;else if(c.v===''||c.v==null)x+=`<c r="${ref}"${s}/>`;else x+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xe(c.v)}</t></is></c>`;});x+='</row>';});
  x+='</sheetData><pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/><pageSetup paperSize="9" orientation="portrait" fitToHeight="0"/></worksheet>';
  files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:x});});
 const n=sheets.length;
 files.push({name:'[Content_Types].xml',data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'});

function hoursCell(min,sum){const hmF=S().hourFmt!=='dec';return hmF?{v:Math.round(min)/1440,s:sum?6:5}:{v:Math.round(min/60*100)/100,s:sum?4:2};}
function periodSheet(e,P,title,range){const st=S();
 const pairs=Math.max(2,...P.weeks.flatMap(w=>w.days.map(d=>d.shifts.length)));
 const H=[{v:'Datum',s:3}];for(let i=0;i<pairs;i++)H.push({v:'Beginn',s:3},{v:'Ende',s:3});const showN=notesOn(e),hc=1+2*pairs;H.push({v:'Stunden',s:3});if(showN)H.push({v:'Bemerkungen',s:3});
 const ncol=H.length,blank=s=>Array.from({length:ncol},()=>({v:'',s}));
 const rows=[[{v:st.company+(st.boss?' · GF '+st.boss:''),s:7}],[{v:title+' '+fullName(e)+(e.nr?' (Pers.-Nr. '+e.nr+')':''),s:1}],[{v:'Zeitraum:',s:1},{v:range}],[],H];
 for(const w of P.weeks){for(const d of w.days){const we=d.date.getDay()%6===0;const r=[{v:fmtDate(d.date),s:we?8:0}];
   for(let i=0;i<pairs;i++){const sh=d.shifts[i];r.push({v:sh?hm(sh.i):''},{v:sh?(sh.o==null?'offen':hmx(sh.o)):''});}
   r.push(d.shifts.length?hoursCell(d.net):{v:''});
   const notes=d.shifts.map(sh=>sh.n).filter(Boolean);if(d.pause>0)notes.push('Pause −'+d.pause+' Min');if(d.shifts.some(sh=>sh.e))notes.push('korrigiert');
   if(showN)r.push({v:notes.join(' · ')});rows.push(r);}
  const wr=blank(3);wr[0]={v:'Woche KW '+w.kw+' ('+dm(w.from)+'–'+dm(w.to)+')',s:3};wr[hc]=hoursCell(w.net,true);rows.push(wr);}
 rows.push([]);const tr=blank(3);tr[0]={v:'Summe Arbeitsstunden',s:3};tr[hc]=hoursCell(P.total.net,true);rows.push(tr);
 rows.push([],[{v:'Erstellt am '+dmy(new Date())+' mit Jet-Zeit V'+VERSION+' · Zeiten gerundet auf '+st.round+' Min',s:8}]);
 const cols=[18];for(let i=0;i<pairs;i++)cols.push(9,9);cols.push(14);if(showN)cols.push(60);return{cols,rows};}
function exportXlsx(secs,ref){const sheets=[];const multi=secs.length>1;
 for(const s of secs){const e=s.emp,pre=multi?e.first+' ':'';
  if(ref.kind==='year'){const rows=[[{v:S().company,s:7}],[{v:'Jahresübersicht '+ref.y+' – '+fullName(e),s:1}],[],[{v:'Monat',s:3},{v:'Stunden',s:3}]];let t=0,dd=0;
   s.periods.forEach(P=>{t+=P.total.net;dd+=P.total.days;rows.push([{v:P.label},hoursCell(P.total.net)]);});
   rows.push([{v:'Gesamt '+ref.y,s:3},hoursCell(t,true)]);sheets.push({name:pre+'Übersicht '+ref.y,cols:[18,20],rows});
   s.periods.filter(hasData).forEach(P=>sheets.push({name:pre+P.label,...periodSheet(e,P,'Arbeitsstunden',P.label)}));}
  else{const P=s.periods[0];sheets.push({name:pre+(ref.kind==='week'?'KW '+isoWeek(P.from)+' '+addDays(P.from,3).getFullYear():P.label),...periodSheet(e,P,'Arbeitsstunden',refLabel(ref))});}}
 download(xlsxBlob(sheets),fileBase(secs,ref)+'.xlsx');}

 <p class="mut">Alle Daten – Mitarbeiter, Fotos, PINs, Einstellungen und Buchungen – stecken in <b>einer Sicherungsdatei</b>. Diese Datei z. B. per Mail oder AirDrop verschicken, auf einen USB-Stick oder ins Netzlaufwerk legen.</p>
 <p>Letzte Sicherung: <b>${lb?dmy(lb)+' '+hm(lb.getHours()*60+lb.getMinutes())+' Uhr':'noch keine'}</b>${due?' · <span class="warn" style="padding:3px 8px">'+esc(due)+'</span>':''}</p>
 <div class="bigacts">${sh?'<button class="btn p" id="dShare">📤 Sicherung teilen<br><span class="small">Mail, AirDrop, WhatsApp, Dateien …</span></button>':''}<button class="btn ${sh?'':'p'}" id="dBak" title="${esc(saveTip())}">💾 Sicherung speichern<br><span class="small">${SAVE_OK?'Ordner selbst wählen':'in den Download-Ordner'} ⓘ</span></button><label class="btn">♻ Sicherung einspielen<br><span class="small">Datei auswählen, Vorschau, bestätigen</span><input type="file" accept=".json,application/json,text/plain" id="dRes" hidden></label></div>
 <p class="small mut" style="margin-top:12px">Vor jedem Einspielen wird der aktuelle Stand automatisch gesichert – es kann also nichts verloren gehen.</p>
 <label class="small">Erinnerung auf der Startseite, wenn die letzte Sicherung älter ist als <select data-s="bakRemind" data-t="n">${[[0,'aus'],[3,'3 Tage'],[7,'7 Tage'],[14,'14 Tage'],[30,'30 Tage']].map(o=>opt(o,st.bakRemind)).join('')}</select></label></div>
 <div class="card"><h3>🕘 Automatische Sicherungen auf diesem Gerät</h3><p class="mut">Jet-Zeit hebt den Stand der letzten 14 Tage sowie die letzten 10 Sicherheitskopien (vor dem Einspielen) automatisch auf.</p><div id="snapList" class="mut">wird geladen …</div></div>
 <div class="card"><h3>📦 Komplettpaket für ein neues Gerät</h3><p class="mut">Eine einzige HTML-Datei mit <b>Programm und allen Daten</b>. Auf dem neuen Gerät öffnen → „Daten übernehmen“ bestätigen → fertig.</p>
 <div class="acts">${sh?'<button class="btn" id="dPackS">📤 Komplettpaket teilen</button>':''}<button class="btn" id="dPack" title="${esc(saveTip())}">📦 Komplettpaket speichern</button>${PACK?'<button class="btn" id="dPackI">Daten aus diesem Paket übernehmen</button>':''}</div></div>
 <div class="card"><h3>Speicherstatus</h3><p>Gespeicherte Buchungen: <b>${c.n}</b> · Mitarbeiter: <b>${c.emps}</b> · Datenmenge ca. <b>${kb} KB</b></p><div class="acts" style="margin-top:0"><button class="btn" id="dInfo">Details zum Speicher</button></div></div>
 ${IMPORTS.length?`<div class="card"><h3>Übernahme aus Excel</h3><p class="mut">Einträge vom November 2026 aus der Excel-Liste. Fehlende Einträge werden ergänzt, vorhandene bleiben unverändert – es entstehen keine Doppelungen.</p><div class="acts"><button class="btn" id="dImp">Excel-Einträge November erneut übernehmen</button></div></div>`:''}
 <div class="card"><h3>Auswertung aller Mitarbeiter</h3><p class="mut">Unter „Zeitlisten“ → „Drucken / Export“ → „Alle Mitarbeiter“ lassen sich Woche, Monat oder Jahr für alle gemeinsam drucken oder exportieren.</p></div>
 <div class="card"><h3>Zurücksetzen</h3><p class="small mut">Auch hier wird vorher automatisch eine Sicherheitskopie angelegt.</p><div class="acts"><button class="btn d" id="dClr">Alle Zeitbuchungen löschen</button><button class="btn d" id="dAll">Alles zurücksetzen (Werkseinstellung)</button></div></div>`;}
function canShareFiles(){try{return !!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File(['{}'],'t.json',{type:'application/json'})]}));}catch(e){return false;}}
async function shareFile(blob,name,title){try{await navigator.share({files:[new File([blob],name,{type:blob.type})],title:title||name});return true;}
 catch(e){if(e&&e.name==='AbortError')return false;toast('Teilen nicht möglich – Datei wird gespeichert',true);download(blob,name);return true;}}
function backupFile(){const n=new Date();return{blob:new Blob([JSON.stringify({app:'Jet-Zeit',version:VERSION,created:n.toISOString(),counts:countBk(DB),db:DB},null,1)],{type:'application/json'}),name:'Jet-Zeit-Sicherung_'+ymd(n)+'_'+pad(n.getHours())+pad(n.getMinutes())+'.json'};}
function markBackup(){DB.settings.lastBackup=new Date().toISOString();save();if(scr==='admin')render();}
function packFile(){const n=new Date();const pack={app:'Jet-Zeit',id:uid(),created:n.toISOString(),version:VERSION,counts:countBk(DB),db:DB};
 const tag='<scr'+'ipt id="jzPack" type="application/json">'+JSON.stringify(pack).replace(/</g,'\\u003c')+'</scr'+'ipt>\n';
 const i=SRC0.indexOf('<scr'+'ipt>');const html=i<0?SRC0:SRC0.slice(0,i)+tag+SRC0.slice(i);
 return{blob:new Blob([html],{type:'text/html'}),name:'Jet-Zeit_V'+VERSION+'_Komplett_'+ymd(n)+'.html'};}
function fmtTs(iso){const d=new Date(iso);return isNaN(d)?'?':dmy(d)+' '+hm(d.getHours()*60+d.getMinutes())+' Uhr';}
/* Wiederherstellen mit Vorschau – vorher immer Sicherheitskopie */
function restoreFrom(j,src,after){const d=j&&(j.db||j);if(!d||!Array.isArray(d.emps)||!d.data){toast('Keine gültige Jet-Zeit-Sicherung',true);return;}
 const c=countBk(d),cur=countBk(DB);
 confirmDlg(`<b>${esc(src)}</b><br>Stand: <b>${j.created?fmtTs(j.created):(d.meta&&d.meta.savedAt?fmtTs(d.meta.savedAt):'unbekannt')}</b><br>Mitarbeiter: <b>${c.emps}</b> (${esc(d.emps.map(e=>e.first).join(', ')||'–')})<br>Buchungen: <b>${c.n}</b>${c.min?' · Zeitraum '+dmy(pd(c.min))+' – '+dmy(pd(c.max)):''}${d.mode==='personal'&&!isPersonal()?'<br><span class="warn" style="display:block;margin-top:6px">Achtung: Diese Sicherung stammt von einem <b>persönlichen Gerät</b>. Nach dem Einspielen läuft auch dieses Gerät im Einzelmodus. Zum Zusammenführen der Stunden kommt in V1.11 die Monatsmeldung.</span>':''}<br><br><span class="mut">Derzeit auf diesem Gerät: ${cur.emps} Mitarbeiter, ${cur.n} Buchungen. Dieser Stand wird vorher automatisch gesichert.</span><br><b>Die aktuellen Daten werden durch die Sicherung ersetzt.</b>`,'Wiederherstellen',async()=>{
  await safetyCopy('Sicherheitskopie vor dem Einspielen');const rev=Math.max((DB.meta&&DB.meta.rev)||0,(d.meta&&d.meta.rev)||0);
  DB=norm(JSON.parse(JSON.stringify(d)));DB.meta.rev=rev;if(after)after();save();render();toast('Sicherung wiederhergestellt');},true);}
async function loadSnapList(){const el=$('#snapList');if(!el)return;if(!window.indexedDB||idbOk===false){el.innerHTML='<span class="warn">Zweitspeicher auf diesem Gerät nicht verfügbar.</span>';return;}
 try{const m=(await idbGet('snaps'))||{};const ks=Object.keys(m).sort((a,b)=>(m[b].time||'').localeCompare(m[a].time||''));
  if(!$('#snapList'))return;
  el.innerHTML=ks.length?ks.map(k=>`<div class="snap"><span style="flex:1;min-width:220px"><b>${fmtTs(m[k].time)}</b><br><span class="small mut">${esc(m[k].label)} · ${m[k].emps} Mitarbeiter · ${m[k].n} Buchungen</span></span><button class="btn" data-sr="${esc(k)}">Wiederherstellen</button><button class="btn" data-sd="${esc(k)}" title="${esc(saveTip())}">💾 Speichern</button></div>`).join(''):'Noch keine automatischen Sicherungen vorhanden.';
  el.querySelectorAll('[data-sr]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sr,v=await idbGet(k);if(v)restoreFrom({created:m[k].time,db:v},m[k].label);});
  el.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sd,v=await idbGet(k);if(!v)return;const t=new Date(m[k].time);
   saveAs(new Blob([JSON.stringify({app:'Jet-Zeit',version:VERSION,created:m[k].time,counts:countBk(v),db:v},null,1)],{type:'application/json'}),'Jet-Zeit-Sicherung_'+ymd(t)+'_'+pad(t.getHours())+pad(t.getMinutes())+'.json','bak');});}
 catch(e){el.innerHTML='<span class="warn">Automatische Sicherungen konnten nicht gelesen werden.</span>';}}
function bDaten(){bindSettings();
 const fc=$('#fsCh');if(fc)fc.onclick=fsChoose;const fgr=$('#fsGr');if(fgr)fgr.onclick=fsGrant;const fo=$('#fsOff');if(fo)fo.onclick=fsDisconnect;
 const fl=$('#fsLbl');if(fl)fl.onclick=()=>askDirLabel(false);
 const fn=$('#fsNow');if(fn)fn.onclick=async()=>{await flushFile();toast(fileSt==='ok'?'In Datei gespeichert':'Datei konnte nicht geschrieben werden',fileSt!=='ok');render();};
 const sh=$('#dShare');if(sh)sh.onclick=async()=>{const f=backupFile();if(await shareFile(f.blob,f.name,'Jet-Zeit Sicherung'))markBackup();};
 $('#dBak').onclick=async()=>{const f=backupFile();if(await saveAs(f.blob,f.name,'bak'))markBackup();};
 $('#dRes').onchange=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{let j;try{j=JSON.parse(fr.result);}catch(x){toast('Datei ist keine Jet-Zeit-Sicherung',true);return;}if(j&&j.type==='setup')applySetup(j);else if(j&&j.type==='report'){if(isPersonal())toast('Monatsmeldungen werden beim Administrator unter „Monatsabschluss“ eingelesen',true);else importReports([f]);}else restoreFrom(j,'Sicherung „'+f.name+'“');};fr.readAsText(f);};
 const ps=$('#dPackS');if(ps)ps.onclick=async()=>{const f=packFile();if(await shareFile(f.blob,f.name,'Jet-Zeit Komplettpaket'))markBackup();};
 $('#dPack').onclick=async()=>{const f=packFile();if(await saveAs(f.blob,f.name,'pack'))markBackup();};
 const pi=$('#dPackI');if(pi)pi.onclick=()=>restoreFrom(PACK,'Daten aus diesem Komplettpaket',()=>{DB.imports=DB.imports||{};DB.imports['pack-'+PACK.id]=true;});
 $('#dInfo').onclick=storageInfo;bindPersonal();
 loadSnapList();
 if($('#dImp'))$('#dImp').onclick=()=>{const before=JSON.stringify(DB.data);IMPORTS.forEach(im=>delete DB.imports[im.id]);delete DB.imports.done;migrate();render();toast(JSON.stringify(DB.data)===before?'Alle Einträge waren bereits vorhanden':'Fehlende Einträge übernommen');};
 $('#dClr').onclick=()=>confirmDlg('Wirklich <b>alle Zeitbuchungen aller Mitarbeiter</b> löschen? Mitarbeiter und Einstellungen bleiben erhalten.<br><span class="mut">Vorher wird automatisch eine Sicherheitskopie angelegt.</span>','Alle Buchungen löschen',async()=>{await safetyCopy('Sicherheitskopie vor „Buchungen löschen“');DB.data={};save();render();toast('Buchungen gelöscht');},true);
 $('#dAll').onclick=()=>confirmDlg('Wirklich <b>alles</b> löschen (Mitarbeiter, Buchungen, Einstellungen, Admin-PIN wird 0000)?<br><span class="mut">Vorher wird automatisch eine Sicherheitskopie angelegt.</span>','Alles zurücksetzen',async()=>{await safetyCopy('Sicherheitskopie vor „Alles zurücksetzen“');const rev=(DB.meta&&DB.meta.rev)||0;DB=norm(seed());DB.emps=[];DB.imports={done:true};DB.meta.rev=rev;save();scr='home';render();toast('Zurückgesetzt');},true);}
/* Komplettpaket: beim Öffnen einer Paket-Datei die enthaltenen Daten anbieten */
let PACK=null;try{const el=document.getElementById('jzPack');if(el)PACK=JSON.parse(el.textContent);}catch(e){PACK=null;}
function checkPack(){if(!PACK||!PACK.db)return;DB.imports=DB.imports||{};if(DB.imports['pack-'+PACK.id])return;
 const c=PACK.counts||countBk(PACK.db),cur=countBk(DB);
 const b=openModal(`<h2>📦 Komplettpaket</h2><p>Diese Datei enthält Jet-Zeit-Daten vom <b>${fmtTs(PACK.created)}</b>:<br>${c.emps} Mitarbeiter, ${c.n} Buchungen.</p><p class="mut">Auf diesem Gerät derzeit: ${cur.emps} Mitarbeiter, ${cur.n} Buchungen. Der aktuelle Stand wird vor der Übernahme automatisch gesichert.</p><div class="acts"><button class="btn" id="pkNo">Nicht übernehmen</button><span class="sp"></span><button class="btn p" id="pkYes">Daten übernehmen</button></div>`);
 b.querySelector('#pkNo').onclick=()=>{closeModal();DB.imports['pack-'+PACK.id]=true;save();toast('Paketdaten nicht übernommen – später unter Administration → Sichern & Daten möglich');};
 b.querySelector('#pkYes').onclick=async()=>{closeModal();await safetyCopy('Sicherheitskopie vor Übernahme Komplettpaket');const rev=Math.max((DB.meta&&DB.meta.rev)||0,(PACK.db.meta&&PACK.db.meta.rev)||0);
  DB=norm(JSON.parse(JSON.stringify(PACK.db)));DB.imports=DB.imports||{};DB.imports['pack-'+PACK.id]=true;DB.meta.rev=rev;save();scr='home';render();toast('Daten aus dem Komplettpaket übernommen');};}

/* ---------- Timer: Uhr, Auto-Abmeldung, Aktualisierung ---------- */
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
let lastMin=-1;
setInterval(()=>{tick();const idle=Date.now()-lastAct,st=S();
 const lim=scr==='admin'?Math.max(300,+st.idleSec||0):(+st.idleSec||0);
 if(lim>0&&idle>lim*1000&&(scr!=='home'||modalOpen())&&!$('#ov').classList.contains('on'))goHome();
 const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;if(scr==='home'&&!modalOpen())renderHome();}},1000);
addEventListener('resize',()=>{if(scr==='home')setCols(DB.emps.filter(e=>e.active).length);});
window.addEventListener('storage',ev=>{if(ev.key===LS&&ev.newValue){DB=load();if(scr==='home')render();}});
render();
bootStore();
</script>
</body>
</html>
