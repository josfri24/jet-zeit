<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffb701">
<meta name="apple-mobile-web-app-title" content="Jet-Zeit">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Jet-Zeit V1.24</title>
<style>
:root{--acc:#1f4e79;--accT:#fff;--bg:#eef1f5;--card:#fff;--ink:#1d2530;--mut:#6b7684;--line:#dde2e9;--ok:#23955a;--go:#d6492f;--dis:#c5cbd3;--we:#f5f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:17px}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
input,select,textarea{user-select:text;-webkit-user-select:text;font:inherit;color:inherit}
button{font:inherit;cursor:pointer;border:0;touch-action:manipulation;color:inherit}
h1,h2,h3{margin:0 0 12px}
h2{font-size:24px} h3{font-size:18px;margin-top:6px}
.mut{color:var(--mut)} .small{font-size:14px} .sp{flex:1}
/* Header */
header{background:var(--acc);color:var(--accT);display:flex;align-items:center;gap:18px;padding:12px 22px;min-height:84px;flex:0 0 auto}
header .logo{height:64px;max-width:300px;object-fit:contain}
header .logo.jet{background:#fff;border-radius:12px;padding:5px 8px;box-shadow:0 1px 4px rgba(0,0,0,.18)} /* V1.24: JET-Logo auf weißem Feld */
header .co{flex:1;min-width:0}
header .co b{display:block;font-size:26px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .co span{opacity:.85;font-size:15px}
header .clk{text-align:right;white-space:nowrap}
header .clk b{font-size:36px;font-variant-numeric:tabular-nums;display:block;line-height:1.05}
header .clk span{font-size:15px;opacity:.85}
main{flex:1;overflow:auto;padding:18px 22px;-webkit-overflow-scrolling:touch}
@supports(padding:max(0px)){
 header{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right))}
 main{padding-left:max(22px,env(safe-area-inset-left));padding-right:max(22px,env(safe-area-inset-right));padding-bottom:max(18px,env(safe-area-inset-bottom))}
 #modal{padding-bottom:max(16px,env(safe-area-inset-bottom))}
 #toast{bottom:max(26px,calc(env(safe-area-inset-bottom) + 12px))}
}
html.ios input,html.ios select,html.ios textarea{font-size:16px!important}
html.ios .ioshide{display:none!important}
html.ios body{-webkit-text-size-adjust:100%}
html.ios .bb,html.ios .btn,html.ios button{-webkit-tap-highlight-color:transparent}
/* Home */
.home{height:100%;display:flex;flex-direction:column;gap:12px}
.emps{flex:1;min-height:0;display:grid;gap:22px;grid-template-columns:repeat(var(--c,4),minmax(0,var(--tw,240px)));grid-template-rows:repeat(var(--r,2),minmax(0,var(--th,210px)));grid-auto-rows:minmax(0,var(--th,210px));justify-content:center;align-content:center;overflow:auto;padding:6px}
.emp{container-type:size;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%;padding:8px;transition:transform .08s,box-shadow .08s;border:4px solid rgba(255,255,255,.92);box-shadow:0 0 0 1px rgba(0,0,0,.10),0 10px 24px rgba(20,30,45,.22);background-image:linear-gradient(160deg,rgba(255,255,255,.18),rgba(0,0,0,.10));min-height:0}
.emp.light{background:#fff!important;background-image:none;border:4px solid var(--ec);color:var(--ink)!important}
.emp.light .av{border-color:var(--ec)}
.emp.light .st{background:var(--ec);color:#fff}
.emp{transition:transform .18s ease,box-shadow .18s ease,filter .18s ease;background-image:linear-gradient(160deg,rgba(255,255,255,.30),rgba(255,255,255,0) 42%,rgba(0,0,0,.16))}
@media (hover:hover){.emp:hover{transform:translateY(-3px) scale(1.035);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 18px 36px rgba(20,30,45,.32),0 0 26px color-mix(in srgb,var(--ec) 60%,transparent);filter:brightness(1.05)}}
.emp:active{transform:scale(.96);box-shadow:0 0 0 1px rgba(0,0,0,.1),0 4px 10px rgba(20,30,45,.2)}
.emp .av{width:min(42cqh,52cqw);height:min(42cqh,52cqw);font-size:min(18cqh,22cqw)}
.av{width:96px;height:96px;flex:0 0 auto;border-radius:50%;background:rgba(255,255,255,.28) center/cover no-repeat;display:inline-flex;align-items:center;justify-content:center;font-size:42px;font-weight:700;border:3px solid rgba(255,255,255,.75)}
.av.sm{width:56px;height:56px;font-size:24px;border-width:2px}
.av.xs{width:40px;height:40px;font-size:18px;border-width:2px}
.emp .nm{font-size:clamp(15px,min(14cqh,16cqw),32px);font-weight:800;line-height:1.1;text-align:center}
.emp .st{font-size:clamp(11px,6.5cqh,14px);background:rgba(0,0,0,.2);padding:3px 10px;border-radius:20px;white-space:nowrap}
main.bgimg{background-size:cover;background-position:center}
main.bgimg .foot span{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
main.bgimg .empty{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.foot{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:14px}
.foot button{background:#fff;border-radius:12px;padding:10px 16px;font-size:15px;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;color:var(--mut);line-height:1.6}
/* Buttons & forms */
.btn{padding:12px 18px;border-radius:12px;background:#e3e8ef;color:var(--ink);font-weight:600;font-size:16px;display:inline-flex;align-items:center;gap:6px;min-height:46px}
.btn.p{background:var(--acc);color:var(--accT)}
.btn.d{background:#fbe1dc;color:#a8321e}
.btn:disabled{opacity:.45}
.card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.fld{display:block;margin:0 0 14px;font-size:14px;color:var(--mut);font-weight:600}
.fld input,.fld select,.row2 input{display:block;width:100%;margin-top:5px;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:#fff;font-size:17px;font-weight:400;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--acc)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chk{display:flex;align-items:center;gap:12px;margin:6px 0 14px;font-size:16px;min-height:40px}
.chk input{width:26px;height:26px;accent-color:var(--acc)}
.acts{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.warn{background:#fff3cd;color:#7a5a00;padding:10px 14px;border-radius:10px;font-size:15px}
.sw{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.sw input[type=color]{width:54px;height:42px;border:1px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.imgrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.seg{display:inline-flex;background:#e3e8ef;border-radius:12px;padding:4px;gap:4px}
.seg button{padding:9px 18px;border-radius:9px;font-weight:600;background:none;min-height:40px}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
/* Employee screen */
.ehead{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ehead .en{flex:1;min-width:180px}
.ehead .en b{display:block;font-size:26px}
.ehead .en span{color:var(--mut)}
.bigb{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:16px}
.bb{height:170px;border-radius:24px;color:#fff;font-size:46px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 16px rgba(0,0,0,.16);transition:transform .08s}
.bb:active:not(:disabled){transform:scale(.97)}
.bb small{font-size:16px;font-weight:500;opacity:.9}
.bb.in{background:var(--ok)} .bb.out{background:var(--go)}
.bb:disabled{background:var(--dis);box-shadow:none;color:#f3f4f6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.kpis div{background:#fff;border-radius:14px;padding:12px 16px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.kpis span{display:block;color:var(--mut);font-size:14px}
.kpis b{font-size:26px;font-variant-numeric:tabular-nums}
.lbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.lbar .nav{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.lbar .nav b{min-width:210px;text-align:center;font-size:17px}
/* Table */
.lp.slim{width:fit-content;max-width:100%;margin:0 auto}
.lp.slim .lbar .nav{flex:0 1 auto}
.tw{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table.tz{width:100%;border-collapse:collapse;font-size:15px}
.tz th{background:var(--acc);color:var(--accT);text-align:left;padding:7px 8px;font-weight:600;white-space:nowrap}
.tz td{padding:3px 8px;height:38px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;vertical-align:middle}
.tz .n{padding-right:14px}
.tz .nt{padding-left:16px}
.tz .n{text-align:right;white-space:nowrap}
.tz td:first-child{white-space:nowrap}
.adm{font-size:15px;max-width:1180px;margin:0 auto}
.adm .atop{margin-bottom:8px}.adm .atop h1{font-size:19px;font-weight:650}
.adm .tabs{gap:4px;margin-bottom:12px}
.adm .tabs button{padding:6px 13px;font-size:14px;border-radius:8px;font-weight:550}
.adm .card{padding:12px 16px;border-radius:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.adm h3{font-size:15px;font-weight:650;margin:2px 0 8px;color:#2b3542}
.adm .card h3+h3,.adm .card *+h3{margin-top:14px}
.adm .fld{font-size:12.5px;font-weight:500;margin:0 0 9px;max-width:560px}
.adm .row2 .fld{max-width:none}
.adm .fld input,.adm .fld select,.adm .row2 input{height:34px;font-size:14.5px;border-width:1px;border-radius:7px;margin-top:3px;padding:0 9px}
.adm .row2{gap:10px;max-width:760px}
.adm .chk{font-size:14px;min-height:26px;margin:2px 0 7px;gap:9px}
.adm .chk input{width:17px;height:17px}
.adm .btn{min-height:34px;padding:6px 12px;font-size:14px;border-radius:8px;font-weight:550}
.adm .acts{margin-top:10px;gap:8px}
.adm .warn{font-size:13px;padding:7px 11px;border-radius:8px}
.adm .mut{font-size:13.5px}.adm .small{font-size:12.5px}
.adm p{margin:6px 0}
.adm .sw{gap:6px}.adm .sw button{width:28px;height:28px;border-width:2px}
.adm .sw input[type=color]{width:40px;height:28px;border-radius:7px}
.adm .bigacts{gap:8px}.adm .bigacts .btn{padding:9px 10px;font-size:14.5px}
.adm .mrow{padding:6px 0;gap:10px}
.adm .snap{padding:6px 0}.adm .snap .btn{padding:5px 10px;font-size:13px;min-height:30px}
.tz tr.b2 td{background:#eaf0f7}
.tz .wd{display:inline-block;width:2.35em}
.tz th.n,.tz td.n{text-align:center}
.tz .nb{display:inline-block;width:132px;text-align:right;white-space:nowrap}
.tz .nh{display:inline-block;width:54%;text-align:right}.tz .nm{display:inline-block;width:46%;text-align:right}
.tz th.c,.tz tbody tr:not(.ws) td:nth-child(2),.tz tbody tr:not(.ws) td:nth-child(3){text-align:center}
.tz tr.ws td.n,.tz tfoot td.n{text-align:center!important}
.tz tr.cf td,.tz tr.cf.b2 td,.tz tr.cf.we td{background:#fde0d9!important}
.tz tr.cf td:first-child{box-shadow:inset 4px 0 0 var(--go)}
.srcm{font-size:11px;color:var(--mut);margin-left:5px;cursor:help}
.mtab{width:100%;border-collapse:collapse;font-size:14px}
.mtab th{text-align:left;font-weight:600;color:var(--mut);font-size:12.5px;padding:6px 8px;border-bottom:1px solid var(--line)}
.mtab td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.mtab .n{text-align:right;white-space:nowrap}
.mtab .ok{color:var(--ok);font-weight:600}.mtab .bad{color:var(--go);font-weight:700;cursor:pointer;text-decoration:underline}
.mnav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnav b{font-size:16px;min-width:140px;text-align:center}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.box.wide{max-width:900px}
.badge.cl{background:#e3e8ef;color:#2b3542}.badge.op{background:#e3f4ea;color:var(--ok)}
.tz tr.we td{background:#f3eefb;color:#5d5670}
.tz tr.we.b2 td{background:#e9e1f6}
.tz tr.we td:first-child{color:#6a4c9c;font-weight:600}
.tz tr.df td{border-top:1px solid #b9c4d2}
.tz tr.nl td{border-bottom:0}
.sdot{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(20,28,38,.85);color:#fff!important;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);position:relative}
.sdot.ok::first-letter{color:#4ade80}.sdot.warn{background:#b26a00}.sdot.err{background:var(--go)}
[data-tip]{position:relative}
@media (hover:hover){[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:0;bottom:calc(100% + 10px);width:290px;white-space:normal;z-index:50;
 background:#fff;color:#1d2733;font-weight:400;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.3);text-align:left}}
.verb{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;cursor:pointer;background:rgba(20,28,38,.85);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);user-select:none;position:relative}
.verb:hover,.verb.open{background:#024794}
.cpc{--s:118px;position:absolute;left:0;bottom:calc(100% + 14px);width:290px;padding:20px 16px 16px;border-radius:20px;z-index:60;cursor:default;
 background:radial-gradient(ellipse at 50% 30%,#1f5bb0,#0b2a57 60%,#06183a);color:#fff;text-align:center;font-weight:400;
 box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,255,255,.12);
 opacity:0;transform:translateY(14px) scale(.92);transform-origin:20% 100%;pointer-events:none;transition:opacity .35s ease,transform .45s cubic-bezier(.2,1.4,.4,1)}
@media (hover:hover){.verb:hover .cpc{opacity:1;transform:none}}
.verb.open .cpc{opacity:1;transform:none}
.cpc::after{content:"";position:absolute;left:34px;bottom:-8px;width:16px;height:16px;background:#071c42;transform:rotate(45deg)}
.cw-stage{height:calc(var(--s)*1.55);perspective:700px;display:flex;align-items:center;justify-content:center;position:relative}
.cw-glow{position:absolute;bottom:4px;left:50%;width:calc(var(--s)*1.1);height:20px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(255,183,1,.6),rgba(255,183,1,0) 70%);filter:blur(5px);animation:cwpulse 3.2s ease-in-out infinite}
@keyframes cwpulse{50%{opacity:.55;transform:translateX(-50%) scaleX(.85)}}
.cw-tilt{transform-style:preserve-3d;animation:cwtilt 7s ease-in-out infinite}
@keyframes cwtilt{0%,100%{transform:rotateX(-20deg)}50%{transform:rotateX(-32deg)}}
.cw-cube{width:var(--s);height:var(--s);position:relative;transform-style:preserve-3d;animation:cwspin 10s linear infinite}
@keyframes cwspin{from{transform:rotateY(0)}to{transform:rotateY(-360deg)}}
.cpc .cw-cube,.cpc .cw-tilt,.cpc .cw-glow,.cpc .cw-a{animation-play-state:paused}
.verb.open .cpc *,.verb:hover .cpc *{animation-play-state:running!important}
.cw-f{position:absolute;inset:0;backface-visibility:hidden;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.cw-f::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),rgba(255,255,255,0) 45%,rgba(0,0,0,.18));pointer-events:none}

.cw-ri{transform:rotateY(90deg) translateZ(calc(var(--s)/2));background:#fff}
.cw-ba{transform:rotateY(180deg) translateZ(calc(var(--s)/2));background:#ffb701}
.cw-le{transform:rotateY(-90deg) translateZ(calc(var(--s)/2));background:#024794}
.cw-to{transform:rotateX(90deg) translateZ(calc(var(--s)/2));background:linear-gradient(135deg,#ffd257,#ffb701)}
.cw-bo{transform:rotateX(-90deg) translateZ(calc(var(--s)/2));background:#06183a}
.cw-hm{transform-origin:50px 50px;animation:cwrot 4s linear infinite}.cw-hh{transform-origin:50px 50px;animation:cwrot 48s linear infinite}
@keyframes cwrot{to{transform:rotate(360deg)}}
.cw-j{stroke-dasharray:120;stroke-dashoffset:120;animation:cwdraw 3.2s ease-in-out infinite}
@keyframes cwdraw{0%{stroke-dashoffset:120}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-120}}
.cw-ttl{font-size:22px;font-weight:800;letter-spacing:.5px;margin-top:6px}.cw-ttl b{color:#ffb701}
.cw-v{font-size:12px;opacity:.75;margin-top:2px}
.cw-c{margin-top:12px;font-size:15px;font-weight:600;background:linear-gradient(90deg,#fff 0%,#fff 40%,#ffb701 50%,#fff 60%,#fff 100%);background-size:250% 100%;
 -webkit-background-clip:text;background-clip:text;color:transparent;animation:cwshine 3s linear infinite}
@keyframes cwshine{from{background-position:100% 0}to{background-position:-150% 0}}
@media (prefers-reduced-motion:reduce){.cpc *{animation:none!important}}
.sdot.ok{color:var(--ok)} .sdot.warn{color:#b26a00} .sdot.err{color:#fff;background:var(--go)}
.bkw{font-size:13px;font-weight:700;padding:6px 12px;border-radius:999px;background:#ffe08a;color:#4a3500;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.snap{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.snap:last-child{border-bottom:0}
.snap .btn{padding:8px 12px;font-size:14px}
.bigacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:10px}
.bigacts .btn{padding:16px 14px;font-size:17px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tz tr.td td,.tz tr.td.we td,.tz tr.td.b2 td{background:#fff6d6}
.tz tr.ct td{border-top:0}
.tz tr.ws td{background:#e2e9f2;font-weight:700;border-bottom:3px solid var(--acc)}
.tz tfoot td{background:var(--acc);color:var(--accT);font-weight:800;font-size:17px;border:0;height:44px}
.tz tr.ws td{height:34px}
.tz .nt{color:var(--mut);font-size:14px}
.tz th.nt{color:var(--accT);font-size:inherit}
input[type=file]{display:none!important}
.tz .open{color:var(--go);font-weight:700}
.tz .nw{white-space:nowrap;text-align:right}
.ed{background:#eef2f7;color:var(--edc,var(--acc));font-size:17px;width:38px;height:32px;border-radius:8px;margin-left:4px}
/* Admin */
.atop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.atop h1{margin:0;font-size:24px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{padding:11px 20px;border-radius:12px;background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.tabs button.on{background:var(--acc);color:var(--accT)}
.mrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .mn{flex:1}
.mrow .mn b{display:block}
.tag{display:inline-block;font-size:12px;background:#e3e8ef;border-radius:6px;padding:2px 7px;margin-right:4px;color:var(--mut)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:30px;background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips button.on{outline:3px solid var(--acc)}
.logoprev{background:var(--acc);border-radius:10px;padding:10px;display:inline-block;min-width:160px;text-align:center;color:var(--mut)}
.logoprev img{max-height:80px;max-width:260px}
/* Modal, PIN */
#modal{position:fixed;inset:0;background:rgba(15,22,32,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}
.box{background:#fff;border-radius:20px;max-width:640px;width:100%;max-height:94vh;overflow:auto;padding:22px 24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.box.pin{max-width:420px;text-align:center}
.pin h2{margin:10px 0 2px}
.dots{display:flex;justify-content:center;gap:14px;height:28px;margin:16px 0 20px}
.dots i{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--acc);display:block}
.dots i.f{background:var(--acc)}
.dots.shake{animation:sh .35s}
@keyframes sh{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pad{display:grid;grid-template-columns:repeat(3,92px);gap:14px;justify-content:center;margin-bottom:16px}
.pad button{height:92px;border-radius:50%;font-size:34px;font-weight:600;background:#f0f3f7}
.pad button:active{background:#d9e1ec}
.pad button.fn{font-size:24px}
.pad button.ok{background:var(--acc);color:var(--accT)}
.pin .av{border-color:var(--line)}
.obtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.obtns .btn{justify-content:center;min-height:58px;font-size:17px}
/* Overlay & toast */
#ov{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:8px}
#ov.on{display:flex} #ov.in{background:var(--ok)} #ov.out{background:var(--go)}
#ov .ovi{font-size:110px;line-height:1}
#ov .ovt{font-size:56px;font-weight:800}
#ov .ovs{font-size:30px}
#ov .ovx{font-size:22px;opacity:.95}
#ov .ovh{font-size:16px;opacity:.8;margin-top:20px}
#ov .btn{background:rgba(255,255,255,.22);color:#fff;margin-top:14px;font-size:18px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120px);background:#1d2530;color:#fff;padding:13px 22px;border-radius:12px;z-index:90;transition:transform .25s;font-weight:600;max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.err{background:#a8321e}
#print{display:none}
@media (max-width:760px){
 .bb{height:130px;font-size:34px}
 .kpis b{font-size:20px}
 .tz{font-size:14px} .tz td,.tz th{padding:6px 6px}

}

function fmtH(min){min=Math.round(min||0);const f=DB.settings.hourFmt;if(f==='hm')return Math.floor(min/60)+':'+pad(min%60);if(f==='dec')return (min/60).toFixed(2).replace('.',',');

const IDB_NAME='jetzeit',IDB_ST='kv';let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{try{const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(IDB_ST);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}});return idbP;}
function idbDo(mode,fn){return idb().then(db=>new Promise((res,rej)=>{const tx=db.transaction(IDB_ST,mode),r=fn(tx.objectStore(IDB_ST));tx.oncomplete=()=>res(r?r.result:undefined);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);}));}

const S=()=>DB.settings;
const getShifts=(e,key)=>((DB.data[e.id]||{})[key])||[];
function setShifts(e,key,arr){if(!DB.data[e.id])DB.data[e.id]={};arr=arr.slice().sort((a,b)=>a.i-b.i);if(arr.length)DB.data[e.id][key]=arr;else delete DB.data[e.id][key];}
function openShift(e){const t=new Date();for(const key of [ymd(t),ymd(addDays(t,-1))]){const a=getShifts(e,key);for(let k=a.length-1;k>=0;k--)if(a[k].o==null)return{date:key,idx:k};}return null;}
function dayCalc(sh){let gross=0,gaps=0,open=false,prevO=null;
 for(const s of sh){if(s.o==null){open=true;continue;}gross+=s.o-s.i;if(prevO!=null&&s.i>prevO)gaps+=s.i-prevO;prevO=s.o;}
 const st=S();let pause=0;
 /* V1.19: Pause nur, wenn eine DURCHGEHENDE Arbeitszeit (Kommen bis Gehen ohne Unterbrechung) die Grenze überschreitet – je Block einmal */
 if(st.pauseOn){let bs=null,be=null;const blocks=[];for(const s of sh){if(s.o==null)continue;if(be!=null&&s.i<=be){be=Math.max(be,s.o);}else{if(bs!=null)blocks.push(be-bs);bs=s.i;be=s.o;}}if(bs!=null)blocks.push(be-bs);
  for(const b of blocks)if(b>st.pauseAfter*60)pause+=Math.min(st.pauseMin,b);}
 return{gross,pause,net:gross-pause,open};}
function buildPeriod(e,from,to,label){const weeks=[];let cur=null;const total={net:0,pause:0,days:0};
 for(let d=new Date(from);d<=to;d=addDays(d,1)){
  if(!cur||d.getDay()===1){cur={kw:isoWeek(d),days:[],net:0};weeks.push(cur);}
  const key=ymd(d),sh=getShifts(e,key),c=dayCalc(sh);
  cur.days.push({date:new Date(d),key,shifts:sh,...c});cur.net+=c.net;total.net+=c.net;total.pause+=c.pause;if(c.gross>0)total.days++;}
 weeks.forEach(w=>{w.from=w.days[0].date;w.to=w.days[w.days.length-1].date;});
 return{from,to,label,weeks,total};}
const monthPeriod=(e,y,m)=>buildPeriod(e,new Date(y,m,1),new Date(y,m+1,0),MON[m]+' '+y);
const weekPeriod=(e,d)=>{const mo=mondayOf(d);return buildPeriod(e,mo,addDays(mo,6),'KW '+isoWeek(mo)+'/'+addDays(mo,3).getFullYear());};
function noteText(d,s,k){const p=[];if(s.n)p.push(s.n);if(s.e)p.push('✎ korrigiert');if(k===d.shifts.length-1&&d.pause>0)p.push('Pause −'+d.pause+' Min');return p.join(' · ');}

 if(os){const s=getShifts(e,os.date)[os.idx];return{canIn:false,canOut:true,since:s.i,text:'Anwesend seit '+hm(s.i)+(os.date!==tk?' (gestern)':'')};}

function pinDialog(o){let v='';const b=openModal(`${o.av||''}<h2>${esc(o.title)}</h2><p class="mut">${esc(o.sub||'Bitte PIN eingeben')}</p><div class="dots" id="dots"></div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-k="${n}">${n}</button>`).join('')}<button data-k="c" class="fn">⌫</button><button data-k="0">0</button><button data-k="ok" class="fn ok">OK</button></div><button class="btn" id="pcan">Abbrechen</button>`,'pin');
 const dots=()=>{const el=$('#dots');if(!el)return;el.innerHTML=o.len?Array.from({length:o.len},(_,i)=>`<i class="${i<v.length?'f':''}"></i>`).join(''):(v.replace(/./g,'<i class="f"></i>')||'<i></i>');};
 const submit=()=>{if(o.check(v)){closeModal();o.ok(v);}else{const d=$('#dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');v='';setTimeout(dots,380);}};
 const key=k=>{if(k==='c')v=v.slice(0,-1);else if(k==='ok'){if(v)submit();return;}else if(v.length<8)v+=k;dots();if(o.len&&v.length===o.len)setTimeout(submit,120);};
 b.querySelectorAll('.pad button').forEach(x=>x.onclick=()=>key(x.dataset.k));
 b.querySelector('#pcan').onclick=closeModal;window._pinKey=key;dots();}
document.addEventListener('keydown',ev=>{if(!window._pinKey)return;if(/^\d$/.test(ev.key))window._pinKey(ev.key);else if(ev.key==='Backspace')window._pinKey('c');else if(ev.key==='Enter')window._pinKey('ok');else if(ev.key==='Escape')closeModal();});

function tableHTML(P,edit,showN){const tk=ymd(new Date()),ec=edit?1:0;showN=showN!==false;const showSrc=SHOWSRC;SHOWSRC=false;
 let h=`<table class="tz${showN?'':' slim'}"><colgroup><col style="width:132px"><col style="width:72px"><col style="width:72px"><col style="width:128px"><col style="width:136px">${showN?'<col>':''}${ec?'<col style="width:92px">':''}</colgroup><thead><tr><th>Datum</th><th class="c">Kommen</th><th class="c">Gehen</th><th class="n">Dauer</th><th class="n">Tag</th>${showN?'<th class="nt">Bemerkung</th>':''}${ec?'<th></th>':''}</tr></thead><tbody>`;
 const rest=(showN?1:0)+ec,restTd=c=>rest?`<td class="nt" colspan="${rest}">${c||''}</td>`:'';
 let di=0;
 for(const w of P.weeks){
  for(const d of w.days){const cls=(d.date.getDay()%6===0?'we ':'')+(d.key===tk?'td ':'')+(di++%2?'b2 ':'b1 ')+'df ';
   if(!d.shifts.length){h+=`<tr class="${cls}"><td>${fmtDateT(d.date)}</td><td></td><td></td><td></td><td></td>${showN?'<td class="nt"></td>':''}${ec?`<td class="nw"><button class="ed" data-ek="${d.key}" data-ei="-1" title="Eintrag hinzufügen">＋</button></td>`:''}</tr>`;continue;}
   const cfs=dayConflicts(d.shifts);d.shifts.forEach((s,k)=>{const last=k===d.shifts.length-1;
    h+=`<tr class="${k?cls.replace('df ',''):cls}${k?'ct ':''}${last?'':'nl '}${cfs.has(k)?'cf':''}"${cfs.has(k)?' title="Überschneidung mit einer anderen Buchung an diesem Tag"':''}><td>${k?'':fmtDateT(d.date)}</td><td>${hm(s.i)}${showSrc&&s.src&&s.src!==DEV.id?`<span class="srcm" title="Herkunft: ${esc(devName(s.src))}">${devIcon(s.src)}</span>`:''}</td><td>${s.o==null?'<span class="open">offen</span>':hm(s.o,true)}</td><td class="n">${nbx(s.o==null?'':fmtH(s.o-s.i))}</td><td class="n"><b>${nbx(last?fmtH(d.net):'')}</b></td>${showN?`<td class="nt">${esc(noteText(d,s,k))}</td>`:''}${ec?`<td class="nw"><button class="ed" data-ek="${d.key}" data-ei="${k}" title="Korrigieren">✎</button>${last?`<button class="ed" data-ek="${d.key}" data-ei="-1" title="Weitere Buchung">＋</button>`:''}</td>`:''}</tr>`;});}
  h+=`<tr class="ws"><td colspan="4">Woche KW ${w.kw} · ${dm(w.from)}–${dm(w.to)}</td><td class="n">${nbx(fmtH(w.net))}</td>${restTd()}</tr>`;}
 h+=`</tbody><tfoot><tr><td colspan="4">Gesamt ${esc(P.label||'')}</td><td class="n">${nbx(fmtH(P.total.net))}</td>${restTd(unitTxt())}</tr></tfoot></table>`;return h;}

/* ---------- Booking ---------- */
function book(type){const e=curEmp,st=status(e),now=new Date(),key=ymd(now);
 const raw=pad(now.getHours())+':'+pad(now.getMinutes())+':'+pad(now.getSeconds());
 const step=Math.max(1,+S().round||1);let m=Math.round((now.getHours()*60+now.getMinutes()+now.getSeconds()/60)/step)*step;
 let dayKey=key;
 if(type==='in'){if(!st.canIn)return;if(m>=1440)m=1440-step;const a=getShifts(e,key).slice();a.push({i:m,o:null,n:'',ri:raw,k:uid(),src:DEV.id});setShifts(e,key,a);}
 else{const os=openShift(e);if(!os)return;dayKey=os.date;const a=getShifts(e,os.date).slice();const s={...a[os.idx]};let o=os.date===key?m:m+1440;if(o<s.i)o=s.i;
  if(o<=s.i){a.splice(os.idx,1);setShifts(e,os.date,a);save();overlay('void',o,dayKey);return;}
  s.o=o;s.ro=raw;a[os.idx]=s;setShifts(e,os.date,a);m=o;}
 save();overlay(type,m,dayKey);}
function overlay(type,m,dayKey){const e=curEmp,h=new Date().getHours(),ov=$('#ov');
 const greet=type==='in'?(h<10?'Guten Morgen':h<17?'Hallo':'Guten Abend')+', '+e.first+'!':'Schönen Feierabend, '+e.first+'!';
 const x=type==='out'?`<div class="ovx">Arbeitszeit an diesem Tag: ${fmtH(dayCalc(getShifts(e,dayKey)).net)} ${unitTxt()}</div>${notesOn(e)?'<button class="btn" id="ovNote">✎ Tätigkeit / Bemerkung eintragen</button>':''}`:'';
 if(type==='void'){ov.className='on out';ov.innerHTML=`<div class="ovi">↺</div><div class="ovt">Keine Buchung</div><div class="ovs">Kommen und Gehen ergeben 0 Minuten –<br>die Buchung wurde verworfen.</div><div class="ovh">Antippen, um in der Ansicht zu bleiben</div>`;
  const sec=+S().afterBookSec;clearTimeout(ovT);ovT=setTimeout(()=>{ov.className='';if(sec>0)goHome();else render();},(sec>0?sec:3)*1000);ov.onclick=()=>{clearTimeout(ovT);ov.className='';render();};return;}
 ov.className='on '+type;ov.innerHTML=`<div class="ovi">✓</div><div class="ovt">${type==='in'?'Kommen':'Gehen'} ${hm(m)}</div><div class="ovs">${esc(greet)}</div>${x}<div class="ovh">Antippen, um in der Ansicht zu bleiben</div>`;
 const sec=+S().afterBookSec;clearTimeout(ovT);
 ovT=setTimeout(()=>{ov.className='';if(sec>0)goHome();else render();},(sec>0?sec:3)*1000);
 ov.onclick=ev=>{clearTimeout(ovT);ov.className='';render();if(ev.target.id==='ovNote'){const a=getShifts(e,dayKey);editEntry(e,dayKey,a.length-1,false,true);}};}

function editEntry(e,key,idx,admin,noteOnly){if(isClosed(key.slice(0,7),e.id)){toast(monLabel(key.slice(0,7))+' ist abgeschlossen – zum Ändern unter Administration → Monatsabschluss wieder öffnen',true);return;}
 const arr=getShifts(e,key).slice(),s=idx>=0?arr[idx]:{i:null,o:null,n:''};

 <div class="row2" ${noteOnly?'style="display:none"':''}><label class="fld">Kommen<input type="time" id="fi" value="${s.i!=null?hm(s.i):''}"></label><label class="fld">Gehen<input type="time" id="fo" value="${s.o!=null?hm(s.o):''}"></label></div>
 <label class="fld" ${notesOn(e)||noteOnly?'':'style="display:none"'}>Bemerkung / Tätigkeit<input type="text" id="fn" maxlength="200" value="${esc(s.n||'')}" placeholder="z. B. Rasen mähen, Bühne aufbauen …"></label>
 ${!noteOnly&&(s.ri||s.ro)?`<p class="mut small">Original-Stempelung: Kommen ${s.ri||'–'} · Gehen ${s.ro||'–'}</p>`:''}
 ${noteOnly?'':'<p class="mut small">Gehen leer = Buchung noch offen. Gehen vor Kommen = über Mitternacht.</p>'}
 <div class="acts">${idx>=0&&!noteOnly?'<button class="btn d" id="fdel">Löschen</button>':''}<span class="sp"></span><button class="btn" id="fcan">Abbrechen</button><button class="btn p" id="fsav">Speichern</button></div>`);
 b.querySelector('#fcan').onclick=closeModal;
 b.querySelector('#fsav').onclick=()=>{const ti=toMin($('#fi').value),to=toMin($('#fo').value),note=$('#fn').value.trim();
  if(ti==null){toast('Bitte eine Kommen-Zeit eingeben',true);return;}
  let o=to;if(o!=null&&o<ti)o+=1440;
  if(o!=null&&o===ti){toast('Kommen und Gehen sind gleich (0 Min) – bitte Zeit korrigieren oder Eintrag löschen',true);return;}
  const changed=ti!==s.i||o!==(s.o??null);
  const ns={...s,i:ti,o,n:note};if(!ns.k)ns.k=uid();if(!ns.src)ns.src=DEV.id;if(changed){ns.e=true;ns.eb=admin?'Admin':'Mitarbeiter';ns.et=new Date().toISOString();}
  if(idx>=0)arr[idx]=ns;else arr.push(ns);setShifts(e,key,arr);save();closeModal();render();toast('Gespeichert');};
 const del=b.querySelector('#fdel');if(del)del.onclick=()=>{if(!del.dataset.c){del.dataset.c=1;del.textContent='Wirklich löschen?';return;}arr.splice(idx,1);setShifts(e,key,arr);save();closeModal();render();toast('Eintrag gelöscht');};
 if(noteOnly)setTimeout(()=>$('#fn')&&$('#fn').focus(),100);}

function loadImg(file,max,type,square){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{let sx=0,sy=0,sw=im.width,sh=im.height;if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m;}const sc=Math.min(1,max/Math.max(sw,sh));const w=Math.round(sw*sc),h=Math.round(sh*sc);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,sx,sy,sw,sh,0,0,w,h);res(c.toDataURL(type,0.85));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}

function pdfTxt(s){return String(s??'').replace(/ ⁺¹/g,' (+1)').replace(/⁺¹/g,'(+1)').replace(/✎/g,'*').replace(/[\u{1F300}-\u{1FAFF}☀-➿️]/gu,'');}
function pdfBytes(s){let o='';for(const ch of pdfTxt(s)){const c=ch.codePointAt(0);if(PDF_MAP[ch])o+=String.fromCharCode(PDF_MAP[ch]);else if(c<256)o+=ch;else o+='?';}return o;}

function pdfEsc(b){let o='';for(let i=0;i<b.length;i++){const c=b.charCodeAt(i);if(c===40||c===41||c===92)o+='\\'+b[i];else if(c<32||c>126)o+='\\'+c.toString(8).padStart(3,'0');else o+=b[i];}return o;}

class PdfDoc{constructor(){this.W=595.28;this.H=841.89;this.pages=[];this.add();}

  this.c.push(`BT ${gray!=null?gray+' g ':'0 g '}/${bold?'F2':'F1'} ${size} Tf ${xx.toFixed(2)} ${y.toFixed(2)} Td (${pdfEsc(b)}) Tj ET`);}
 rect(x,y,w,h,fill){this.c.push(`${fill} rg ${x.toFixed(2)} ${y.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);}
 line(x1,y1,x2,y2,g,wd){this.c.push(`${g} G ${wd} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);}
 img(x,y,w,h){this.c.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im1 Do Q`);}
 build(){const objs=[],L=PDF_LOGO,np=this.pages.length;let kids=[];const first=L?6:5;
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  if(L)objs[5]=`<< /Type /XObject /Subtype /Image /Width ${L.w} /Height ${L.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${L.data.length} >>\nstream\n${L.data}\nendstream`;
  this.pages.forEach((c,i)=>{const po=first+i*2,co=po+1,s=c.join('\n');kids.push(po+' 0 R');
   objs[po]=`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${L?' /XObject << /Im1 5 0 R >>':''} >> /Contents ${co} 0 R >>`;

 if(d.mode==='personal'&&adminGuard('Die Sicherung eines Mitarbeiter-Handys einzuspielen'))return;
 const c=countBk(d),cur=countBk(DB);
 confirmDlg(`<b>${esc(src)}</b><br>Stand: <b>${j.created?fmtTs(j.created):(d.meta&&d.meta.savedAt?fmtTs(d.meta.savedAt):'unbekannt')}</b><br>Mitarbeiter: <b>${c.emps}</b> (${esc(d.emps.map(e=>e.first).join(', ')||'–')})<br>Buchungen: <b>${c.n}</b>${c.min?' · Zeitraum '+dmy(pd(c.min))+' – '+dmy(pd(c.max)):''}${d.mode==='personal'&&!isPersonal()?'<br><span class="warn" style="display:block;margin-top:6px">Achtung: Diese Sicherung stammt von einem <b>persönlichen Gerät</b>. Nach dem Einspielen läuft auch dieses Gerät im Einzelmodus. Zum Zusammenführen der Stunden kommt in V1.11 die Monatsmeldung.</span>':''}<br><br><span class="mut">Derzeit auf diesem Gerät: ${cur.emps} Mitarbeiter, ${cur.n} Buchungen. Dieser Stand wird vorher automatisch gesichert.</span><br><b>Die aktuellen Daten werden durch die Sicherung ersetzt.</b>`,'Wiederherstellen',async()=>{
  await safetyCopy('Sicherheitskopie vor dem Einspielen');const rev=Math.max((DB.meta&&DB.meta.rev)||0,(d.meta&&d.meta.rev)||0);
  DB=norm(JSON.parse(JSON.stringify(d)));DB.meta.rev=rev;if(after)after();save();render();toast('Sicherung wiederhergestellt');},true);}
async function loadSnapList(){const el=$('#snapList');if(!el)return;if(!window.indexedDB||idbOk===false){el.innerHTML='<span class="warn">Zweitspeicher auf diesem Gerät nicht verfügbar.</span>';return;}
 try{const m=(await idbGet('snaps'))||{};const ks=Object.keys(m).sort((a,b)=>(m[b].time||'').localeCompare(m[a].time||''));
  if(!$('#snapList'))return;
  el.innerHTML=ks.length?ks.map(k=>`<div class="snap"><span style="flex:1;min-width:220px"><b>${fmtTs(m[k].time)}</b><br><span class="small mut">${esc(m[k].label)} · ${m[k].emps} Mitarbeiter · ${m[k].n} Buchungen</span></span><button class="btn" data-sr="${esc(k)}">Wiederherstellen</button><button class="btn" data-sd="${esc(k)}" title="${esc(saveTip())}">${IOS&&canShareFiles()?'📤 Teilen':SAVE_LBL()}</button></div>`).join(''):'Noch keine automatischen Sicherungen vorhanden.';
  el.querySelectorAll('[data-sr]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sr,v=await idbGet(k);if(v)restoreFrom({created:m[k].time,db:v},m[k].label);});
  el.querySelectorAll('[data-sd]').forEach(b=>b.onclick=async()=>{const k=b.dataset.sd,v=await idbGet(k);if(!v)return;const t=new Date(m[k].time);
   saveAs(new Blob([JSON.stringify({app:'Jet-Zeit',version:VERSION,created:m[k].time,counts:countBk(v),db:v},null,1)],{type:'application/json'}),'Jet-Zeit-Sicherung_'+ymd(t)+'_'+pad(t.getHours())+pad(t.getMinutes())+'.json','bak');});}
 catch(e){el.innerHTML='<span class="warn">Automatische Sicherungen konnten nicht gelesen werden.</span>';}}
function bDaten(){bindSettings();
 const fc=$('#fsCh');if(fc)fc.onclick=fsChoose;const fgr=$('#fsGr');if(fgr)fgr.onclick=fsGrant;const fo=$('#fsOff');if(fo)fo.onclick=fsDisconnect;
 
 const fn=$('#fsNow');if(fn)fn.onclick=async()=>{await flushFile();toast(fileSt==='ok'?'In Datei gespeichert':'Datei konnte nicht geschrieben werden',fileSt!=='ok');render();};
 const sh=$('#dShare');if(sh)sh.onclick=async()=>{const f=backupFile();if(await shareFile(f.blob,f.name,'Jet-Zeit Sicherung'))markBackup();};
 $('#dBak').onclick=async()=>{const f=backupFile();if(await saveAs(f.blob,f.name,'bak'))markBackup();};
 $('#dRes').onchange=ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;const fr=new FileReader();fr.onload=()=>{let j;try{j=JSON.parse(fr.result);}catch(x){toast('Datei ist keine Jet-Zeit-Sicherung',true);return;}if(j&&j.type==='setup')applySetup(j);else if(j&&j.type==='report'){if(isPersonal())toast('Monatsmeldungen werden beim Administrator unter „Monatsabschluss“ eingelesen',true);else importReports([f]);}else restoreFrom(j,'Sicherung „'+f.name+'“');};fr.readAsText(f);};
 const ps=$('#dPackS');if(ps)ps.onclick=async()=>{const f=packFile();if(await shareFile(f.blob,f.name,'Jet-Zeit Komplettpaket'))markBackup();};
 if($('#dPack'))$('#dPack').onclick=async()=>{const f=packFile();if(await saveAs(f.blob,f.name,'pack'))markBackup();};
 const pi=$('#dPackI');if(pi)pi.onclick=()=>restoreFrom(PACK,'Daten aus diesem Komplettpaket',()=>{DB.imports=DB.imports||{};DB.imports['pack-'+PACK.id]=true;});
 $('#dInfo').onclick=storageInfo;bindPersonal();
 loadSnapList();bindInfo();
 if($('#dImp'))$('#dImp').onclick=()=>{const before=JSON.stringify(DB.data);IMPORTS.forEach(im=>delete DB.imports[im.id]);delete DB.imports.done;migrate();render();toast(JSON.stringify(DB.data)===before?'Alle Einträge waren bereits vorhanden':'Fehlende Einträge übernommen');};
 if($('#dClr'))$('#dClr').onclick=()=>confirmDlg('Wirklich <b>alle Zeitbuchungen aller Mitarbeiter</b> löschen? Mitarbeiter und Einstellungen bleiben erhalten.<br><span class="mut">Vorher wird automatisch eine Sicherheitskopie angelegt.</span>','Alle Buchungen löschen',async()=>{await safetyCopy('Sicherheitskopie vor „Buchungen löschen“');DB.data={};save();render();toast('Buchungen gelöscht');},true);
 if($('#dAll'))$('#dAll').onclick=()=>confirmDlg('Wirklich <b>alles</b> löschen (Mitarbeiter, Buchungen, Einstellungen, Admin-PIN wird 0000)?<br><span class="mut">Vorher wird automatisch eine Sicherheitskopie angelegt.</span>','Alles zurücksetzen',async()=>{await safetyCopy('Sicherheitskopie vor „Alles zurücksetzen“');const rev=(DB.meta&&DB.meta.rev)||0;DB=norm(seed());DB.emps=[];DB.imports={done:true};DB.meta.rev=rev;save();scr='home';render();toast('Zurückgesetzt');},true);}
/* Komplettpaket: beim Öffnen einer Paket-Datei die enthaltenen Daten anbieten */
let PACK=null;try{const el=document.getElementById('jzPack');if(el)PACK=JSON.parse(el.textContent);}catch(e){PACK=null;}
function checkPack(){if(!PACK||!PACK.db)return;DB.imports=DB.imports||{};if(DB.imports['pack-'+PACK.id])return;
 const c=PACK.counts||countBk(PACK.db),cur=countBk(DB);
 const b=openModal(`<h2>📦 Komplettpaket</h2><p>Diese Datei enthält Jet-Zeit-Daten vom <b>${fmtTs(PACK.created)}</b>:<br>${c.emps} Mitarbeiter, ${c.n} Buchungen.</p><p class="mut">Auf diesem Gerät derzeit: ${cur.emps} Mitarbeiter, ${cur.n} Buchungen. Der aktuelle Stand wird vor der Übernahme automatisch gesichert.</p><div class="acts"><button class="btn" id="pkNo">Nicht übernehmen</button><span class="sp"></span><button class="btn p" id="pkYes">Daten übernehmen</button></div>`);
 b.querySelector('#pkNo').onclick=()=>{closeModal();DB.imports['pack-'+PACK.id]=true;save();toast('Paketdaten nicht übernommen – später unter Administration → Sichern & Daten möglich');};
 b.querySelector('#pkYes').onclick=async()=>{closeModal();await safetyCopy('Sicherheitskopie vor Übernahme Komplettpaket');const rev=Math.max((DB.meta&&DB.meta.rev)||0,(PACK.db.meta&&PACK.db.meta.rev)||0);
  DB=norm(JSON.parse(JSON.stringify(PACK.db)));DB.imports=DB.imports||{};DB.imports['pack-'+PACK.id]=true;DB.meta.rev=rev;save();scr='home';render();toast('Daten aus dem Komplettpaket übernommen');};}

/* ---------- Timer: Uhr, Auto-Abmeldung, Aktualisierung ---------- */
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();},{passive:true}));
let lastMin=-1;
setInterval(()=>{tick();const idle=Date.now()-lastAct,st=S();
 const lim=scr==='admin'?Math.max(300,+st.idleSec||0):(+st.idleSec||0);
 if(lim>0&&idle>lim*1000&&(scr!=='home'||modalOpen())&&!$('#ov').classList.contains('on'))goHome();
 const m=new Date().getMinutes();if(m!==lastMin){lastMin=m;if(scr==='home'&&!modalOpen())renderHome();}},1000);
addEventListener('resize',()=>{if(scr==='home')setCols(DB.emps.filter(e=>e.active).length);});
window.addEventListener('storage',ev=>{if(ev.key===LS&&ev.newValue){DB=load();if(scr==='home')render();}});
render();
bootStore();
</script>
